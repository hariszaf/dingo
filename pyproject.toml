[build-system]
requires = ["setuptools>=77.0", "wheel", "cython", "numpy", "build"]
build-backend = "setuptools.build_meta"

[project]
name          = "dingo-walk"
description   = "A python library for metabolic networks sampling and analysis. dingo is part of GeomScale project"
authors       = [{ name = "Apostolos Chalkis", email = "tolis.chal@gmail.com" }]
license-files = ["LICENSE"]
dynamic       = ["version"]

requires-python = ">=3.8,<3.11"
dependencies    = [
    "sparseqr>=1.4.1",
    "simplejson>=3.17.2",
    "numpy>=1.22.4,<1.26",  # has to be in line with pandas as well
    "scipy>=1.6.1",
    "matplotlib>=3.4.1",
    "cobra>=0.26.0",
    "plotly>=5.11.0",
    "kaleido==0.2.1",
    "pyoptinterface[highs]>=0.2.7",
    "networkx==3.1",
]

[tool.setuptools.dynamic]
version = { attr = "dingo.__version__" }


[project.optional-dependencies]
dev = ["cython>=0.29.22", "numpy>=1.22.4,<1.26"]

