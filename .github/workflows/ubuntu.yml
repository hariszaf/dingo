  # ------------------------------------------------------------------------------------------

  # Publish
  publish-testpypi:
    name: Upload to TestPyPI
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    environment:
      name: testpypi

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-wheels
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: macos-wheels
          path: dist/

      - name: Install Twine
        run: python -m pip install twine

      - name: List built wheels
        run: |
          echo "All wheels built during the distribution-specific jobs (in dist/)"
          ls dist/

      - name: Fix wheels metadata
        run: |
          mkdir -p fixed_dist
          for whl in dist/*.whl; do
            mkdir -p wheel_unpack
            unzip "$whl" -d wheel_unpack

            METADATA=$(find wheel_unpack -name METADATA)
            sed -i '/^Dynamic: license-file/d' "$METADATA"

            fixed_whl="fixed_dist/$(basename "$whl")"
            (cd wheel_unpack && zip -r "../${fixed_whl}" .)

            rm -rf wheel_unpack
          done

          # Replace old wheels with fixed ones
          rm dist/*.whl
          mv fixed_dist/*.whl dist/

      - name: List built wheels after fixing metadata
        run: |
          echo "All wheels built during the distribution-specific jobs (in dist/)"
          ls dist/

      - name: Publish to TestPyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TESTPYPI_API_TOKEN }}
        run: |
          twine check dist/*
          twine upload --repository-url https://test.pypi.org/legacy/ dist/*
