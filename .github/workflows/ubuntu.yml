          #   rm "$whl"
          #   (cd wheel_unpack && zip -r "../$(basename $whl)" .)
          #   rm -rf wheel_unpack
          # done

      # - name: Install dependencies and set flags for SuiteSparse
      #   run: |
      #     export CFLAGS="-I/usr/local/opt/suite-sparse/include/suitesparse"
      #     export LDFLAGS="-L/usr/local/opt/suite-sparse/lib"

      #     pip install sparseqr

      # - name: Install and test the built wheel
      #   run: |
      #     echo "All wheels in macos dist/"
      #     ls dist/
      #     WHEEL_FILE=$(ls dist/*cp310*macosx*.whl | head -n 1)
      #     echo "Installing $WHEEL_FILE"
      #     pip install "$WHEEL_FILE"

      # - name: Run tests
      #   run: |
      #     # Ensures that only the Homebrew-provided libomp.dylib is loaded, avoiding that conflict.
      #     export DYLD_LIBRARY_PATH="$HOMEBREW_PREFIX/opt/libomp/lib:$DYLD_LIBRARY_PATH"

      #     python3 tests/fba.py
      #     python3 tests/full_dimensional.py
      #     python3 tests/max_ball.py
